name: CI

# Runs the full suite against a real, freshly migrated PostgreSQL on every
# push and pull request. This project's money logic depends on real
# select_for_update() row locking and real sequences — SQLite silently no-ops
# the former, so a real Postgres service container here is not optional; a
# green run against SQLite would prove nothing about the concurrency tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: speech_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-key-never-used-outside-this-run
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: speech_erp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Django system check
        run: python manage.py check --settings=config.settings.test

      - name: Fail if a model change has no migration
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run the test suite
        # apps/common/tests/test_openapi_schema.py is part of this run and
        # separately asserts the OpenAPI schema builds with zero generation
        # errors -- no separate `manage.py spectacular` step needed here.
        run: pytest --create-db --cov=apps --cov-report=term-missing
