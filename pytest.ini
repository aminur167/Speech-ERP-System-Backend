[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --reuse-db keeps the test database between runs, which makes the suite fast
# enough to actually run every time. Pass --create-db after a migration change.
addopts =
    --reuse-db
    --strict-markers
    -ra

markers =
    slow: tests that are noticeably slower (concurrency, large datasets)
    isolation: branch data-isolation tests — these guard the tenant boundary
    money: tests covering currency correctness, atomicity, and race conditions
