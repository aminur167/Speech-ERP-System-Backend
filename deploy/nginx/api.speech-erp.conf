# Backend (Django/DRF via gunicorn), on its own subdomain.
#
# Deliberately NOT sharing an origin/path prefix with the frontend: Django
# serves its admin panel at /admin/, and the Next.js app has its own
# /admin/* route segment (see src/app/admin) -- collapsing both onto one
# domain would collide. Two subdomains sidesteps that entirely and matches
# how CORS_ALLOWED_ORIGINS is already configured for cross-origin calls.
#
# Install: copy to /etc/nginx/sites-available/api.speech-erp.conf, symlink
# into sites-enabled, then run certbot (see docs/DEPLOYMENT.md) -- certbot
# rewrites the server block below to add the actual SSL directives and a
# port-80-to-443 redirect; the HTTP block here is only the ACME challenge
# path certbot needs before a certificate exists.

upstream speech_erp_backend {
    server unix:/run/speech-erp/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;  # CHANGE ME

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.yourdomain.com;  # CHANGE ME

    # Populated by `certbot --nginx` -- placeholders so this file is valid
    # nginx config even before certbot has run.
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    access_log /var/log/nginx/speech-erp-api.access.log;
    error_log  /var/log/nginx/speech-erp-api.error.log;

    # Served directly rather than proxied through gunicorn -- Django admin's
    # CSS/JS, collected via `manage.py collectstatic`.
    location /static/ {
        alias /opt/speech-erp/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://speech_erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER (production.py) trusts exactly
        # this header to know the original request was HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
