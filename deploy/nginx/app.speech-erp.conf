# Frontend (Next.js, `next start`), on the primary domain.
#
# See api.speech-erp.conf for why this is a separate subdomain from the
# backend rather than one origin with path-based routing.
#
# Install: copy to /etc/nginx/sites-available/app.speech-erp.conf, symlink
# into sites-enabled, then run certbot (see docs/DEPLOYMENT.md).

upstream speech_erp_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;  # CHANGE ME

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;  # CHANGE ME

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/speech-erp-app.access.log;
    error_log  /var/log/nginx/speech-erp-app.error.log;

    # Next.js's own build-hashed asset paths -- safe to cache aggressively,
    # a new deploy ships new hashes rather than mutating these files.
    location /_next/static/ {
        proxy_pass http://speech_erp_frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://speech_erp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
