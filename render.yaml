# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and creates the service below. Every envVar marked `sync: false`
# is a secret Render will prompt for during that setup instead of reading a
# value from here -- nothing sensitive is committed.
#
# migrate runs on every start, not just the first deploy: Django migrations
# are idempotent (a no-op once already applied), so this is the simplest way
# to guarantee a new release's migrations always run before gunicorn starts
# serving it, with no separate "run this once" step to remember.

services:
  - type: web
    name: speech-erp-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements/prod.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Render's own default domain (<service-name>.onrender.com) once
      # assigned, plus your custom domain if you add one later.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # Your Vercel frontend's URL, e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSLMODE
        value: require
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional -- leave unset in the dashboard to skip these features.
      - key: SENTRY_DSN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

  # ---------------------------------------------------------------------
  # Scheduled billing jobs
  #
  # Without these two nothing invoices and nothing enforces the payment
  # deadline, and neither failure announces itself: the app keeps serving
  # perfectly while quietly stopping to bill. They are the reason a clinic
  # notices in March that February was never charged.
  #
  # Render cron jobs are not offered on the free plan, so these need a paid
  # instance. If the service is staying free, the same two commands can be
  # driven from any external scheduler that can run a shell command against
  # this database — see docs/DEPLOYMENT.md §10 for the crontab form.
  #
  # Both are idempotent and catch-up capable: a missed night is repaired by
  # the next run, and a double run changes nothing.
  # ---------------------------------------------------------------------

  - type: cron
    name: speech-erp-generate-monthly-bills
    runtime: python
    region: singapore
    # 01:00 on the 1st — opens each active enrollment's next month.
    schedule: "0 1 1 * *"
    buildCommand: "pip install -r requirements/prod.txt"
    startCommand: "python manage.py generate_monthly_bills"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSLMODE
        value: require

  # No cron for terminate_unpaid_monthly_services, deliberately.
  #
  # Making a service inactive is a manager's decision now, taken month by
  # month with a written reason for anything cancelled — a nightly job doing
  # it silently would be the one thing that rule exists to prevent, and the
  # patient would have no route back that anybody could see. The management
  # command is kept for the manual catch-up case; nothing schedules it.

  # ---------------------------------------------------------------------
  # Scheduled attendance close-out
  #
  # Without this, a no-show is only ever marked absent lazily, the next time
  # someone opens the Staff page after 4pm -- correct eventually, but not
  # "real-time" if nobody happens to look that day. This closes every
  # branch out on a timer instead. Low-stakes compared to the billing jobs
  # above (nothing financial depends on it, and the lazy per-request check
  # in apps/staff/views.py stays as a fallback), so it's fine to skip on the
  # free plan -- see docs/DEPLOYMENT.md §11 for the crontab form.
  # ---------------------------------------------------------------------

  - type: cron
    name: speech-erp-close-out-attendance
    runtime: python
    region: singapore
    # 10:05 UTC == 16:05 Asia/Dhaka -- shortly after office hours end. Runs
    # every day; the weekly holiday (Friday) is skipped inside the command
    # itself (apps/staff/services.py's mark_no_show_absentees), not here.
    schedule: "5 10 * * *"
    buildCommand: "pip install -r requirements/prod.txt"
    startCommand: "python manage.py close_out_daily_attendance"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSLMODE
        value: require
